# n8n webhook dedupe demo. All host ports are bound to 127.0.0.1 only.
# Secrets come from .env (generated by `python scripts/demo.py setup`).

name: n8n-webhook-dedupe-demo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dedupe}
      POSTGRES_USER: ${POSTGRES_USER:-dedupe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  mock-llm:
    image: python:3.12-slim
    command: ["python", "-u", "/app/server.py"]
    environment:
      MOCK_LATENCY_S: ${MOCK_LATENCY_S:-1.5}
      MOCK_FAIL_FIRST: ${MOCK_FAIL_FIRST:-}
    volumes:
      - ./mock_llm:/app:ro
    ports:
      - "127.0.0.1:${MOCK_LLM_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 30

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.47.5}
    depends_on:
      postgres:
        condition: service_healthy
      mock-llm:
        condition: service_healthy
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      # The workflows read the LLM endpoint from env via $env, so allow it.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://mock-llm:8000/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-mock-key-not-secret}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/import/workflows:ro
      - ./data/import:/import/data:ro
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5678/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  pg_data:
  n8n_data:
